name: Build Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set release version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-version.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build application and bundle Node runtime
        run: npm run package
      - name: UI and MCP regression tests
        run: npm run test:ui
      - name: Install NSIS if needed
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build single-file installer
        run: npm run installer
      - name: Install and smoke-test with no system Node on PATH
        shell: pwsh
        run: |
          $installRoot = Join-Path $PWD 'tests/tmp/installed'
          $setup = Get-ChildItem release/ModelTide-*-Setup-x64.exe | Select-Object -First 1
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$installRoot" -WindowStyle Hidden -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer exited $($installer.ExitCode)" }
          $env:MODELTIDE_PACKAGED_ROOT = $installRoot
          npm run test:packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package local plugin and checksums
        shell: pwsh
        run: |
          tar -a -c -f release/modeltide-plugin.zip -C release/modeltide-plugin .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem release/ModelTide-*-Setup-x64.exe, release/modeltide-plugin.zip |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ModelTide-Windows-x64
          path: |
            release/ModelTide-*-Setup-x64.exe
            release/modeltide-plugin.zip
            release/SHA256SUMS.txt
            release/README.md
            release/LICENSE
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: |
            tests/tmp/ui/report.json
            tests/tmp/ui/panel.png
            tests/tmp/packaged/report.json
          if-no-files-found: ignore

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ModelTide-Windows-x64
          path: release
      - name: Upload assets and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $version = $tag.Substring(1)
          $assets = @("release/ModelTide-$version-Setup-x64.exe", 'release/modeltide-plugin.zip', 'release/SHA256SUMS.txt', 'release/README.md', 'release/LICENSE')
          foreach ($asset in $assets) {
            if (!(Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
          }
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) {
              throw "Release $tag is already published. Use a new version tag instead of replacing released files."
            }
          } else {
            $flags = @('--verify-tag', '--generate-notes', '--draft', '--title', "ModelTide $tag")
            if ($version.Contains('-')) { $flags += '--prerelease' }
            gh release create $tag @flags
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; the release remains a draft for retry' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
